<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
  <defs>
    <style>
      .text { 
        font-family: 'Poppins', Arial, sans-serif; 
        font-weight: 700; 
        font-size: 120px; 
        fill: #FFFFFF;
        letter-spacing: 4px;
      }
      .line { 
        stroke: #FFFFFF; 
        stroke-width: 18; 
        fill: none; 
        stroke-linecap: round; 
        stroke-linejoin: round;
      }
      .node {
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Shield Outer -->
  <path class="line" d="M220 40 L280 60 C310 75 330 110 340 150 
