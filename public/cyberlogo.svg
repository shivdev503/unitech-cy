  <circle class="node" cx="220" cy="150" r="12" />

  <!-- Circuit Middle -->
  <path class="line" d="M205 250 C225 210 245 185 275 145"/>
  <circle class="node" cx="275" cy="145" r="12" />

  <!-- Circuit Right -->
  <path class="line" d="M245 250 C265 220 285 195 310 165"/>
  <circle class="node" cx="310" cy="165" r="12" />

  <!-- Company Name -->
  <text x="420" y="265" class="text">UNITECHCYBER</text>
</svg>
